name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: JDK 21 Build and Test
    runs-on: ubuntu-latest

    steps:
      # Mnemosyne resolves from Maven Central as
      # ai.mattmann.mnemosyne:1.11.0; nothing to build from source.
      - name: Check out DRAT
        uses: actions/checkout@v4
        with:
          path: drat

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Node 22, not 18. jsdom reaches whatwg-url, which now depends on
      # @exodus/bytes, and that package is ESM only: requiring it from
      # CommonJS is ERR_REQUIRE_ESM on Node 18, which cannot require an ES
      # module at all. Node 22.12 can, so the frontend suite runs there.
      # Node 18 also went end of life in April 2025.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: drat/webapps/proteus/src/main/webapp/resources/package-lock.json

      # The Solr tarball is 343MB and both Apache hosts serve it at about
      # 380KB/s, so fetching it costs fifteen minutes. Cached outside
      # target/, because the build runs `mvn clean install` and would delete
      # anything cached under target/ before the download step ran.
      - name: Cache the Solr distribution
        uses: actions/cache@v4
        with:
          path: ~/.cache/drat-solr
          # distribution/pom.xml, because that is where solr.version is
          # declared. Hashing the root pom instead looks fine until the next
          # Solr upgrade: the key would not change, so the stale tarball is
          # restored, the build correctly re-downloads the new one, and the
          # save is then skipped because the key already exists. The cache
          # would quietly never hold the new version again.
          key: solr-${{ hashFiles('drat/distribution/pom.xml') }}
          restore-keys: solr-

      # install rather than test, so the packaged distribution exists for the
      # assertions below. `mvn test` on its own also works.
      - name: Build and test DRAT
        working-directory: drat
        run: mvn -B clean install

      # The Proteus suite ran only on Windows, which is backwards: these
      # tests cover the panels rather than anything platform specific, and
      # the platform they are developed on was the one not running them.
      # node_modules is already installed by the npm ci the Maven build
      # runs, so this only executes them.
      - name: Test Proteus frontend
        working-directory: drat/webapps/proteus/src/main/webapp/resources
        run: npm test -- --run

      - name: Check the distribution contents
        working-directory: drat
        run: |
          set -e
          TARBALL=$(ls distribution/target/dms-distribution-*-bin.tar.gz)

          # Java 9 removed the extension mechanism; any launcher still naming
          # it fails at startup. Assert the scan is non-vacuous first so a
          # wildcard matching nothing cannot pass silently.
          LAUNCHERS=$(tar tzf "$TARBALL" | grep -cE '^[^/]+/bin/[^/]+$')
          echo "scanning $LAUNCHERS launcher scripts"
          test "$LAUNCHERS" -gt 10
          ! tar xzOf "$TARBALL" --wildcards '*/bin/*' 2>/dev/null | grep -q 'java.ext.dirs'

          # Tomcat ships bin/*.sh non-executable through the fileSet unless
          # they are re-added with an explicit mode.
          tar tvzf "$TARBALL" | grep -E 'tomcat/bin/catalina.sh' | grep -q '^-rwx'

          # W2 + HSQLDB is the default. Each of these was missing from the
          # tarball while the drat-w2 deployment ran on them, which is how a
          # proven configuration stayed un-shippable.
          tar tzf "$TARBALL" | grep -q 'workflow/policy-wengine/drat-audit.xml'
          tar tzf "$TARBALL" | grep -q 'workflow/etc/wengine-lifecycle.xml'
          tar tzf "$TARBALL" | grep -q 'workflow/lib/hsqldb-'

          # The engine reads workflows from policy-wengine through the
          # packaged repo. Shipping one without the other starts a manager
          # with no workflows at all.
          # No '*/' prefix: this tarball has no top-level directory, so a
          # leading wildcard matches nothing. ('*/bin/*' above works only
          # because of paths like workflow/bin/wmgr.)
          PROPS=$(tar xzOf "$TARBALL" workflow/etc/workflow.properties)
          echo "$PROPS" | grep -q 'workflow.engine.factory *= *org.apache.oodt.cas.workflow.engine.PrioritizedQueueBasedWorkflowEngineFactory'
          echo "$PROPS" | grep -q 'workflow.repo.factory *= *org.apache.oodt.cas.workflow.repository.PackagedWorkflowRepositoryFactory'
          echo "$PROPS" | grep -q 'instanceRep.factory *= *org.apache.oodt.cas.workflow.instrepo.DataSourceWorkflowInstanceRepositoryFactory'
          echo "$PROPS" | grep -q 'jdbc.url=jdbc:hsqldb:file:'

          # The schema has to be creatable before the manager takes the lock.
          # The tool and the schema both come from cas-workflow now; DRAT
          # carried copies of each until Mnemosyne 1.13.1.
          WF=$(tar tzf "$TARBALL" | grep -E 'workflow/lib/cas-workflow-.*\.jar$' | head -1)
          test -n "$WF"
          tar xzOf "$TARBALL" "$WF" > /tmp/cas-workflow.jar
          unzip -l /tmp/cas-workflow.jar | grep -q 'org/apache/oodt/cas/workflow/instrepo/WorkflowInstanceSchema.class'
          unzip -l /tmp/cas-workflow.jar | grep -q ' workflow.sql$'
          ! tar tzf "$TARBALL" | grep -q 'workflow/etc/workflow-hsqldb.sql'

          echo "distribution contents OK"

      - name: Upload DRAT distribution
        uses: actions/upload-artifact@v4
        with:
          name: drat-distribution
          path: drat/distribution/target/dms-distribution-*-bin.tar.gz
          if-no-files-found: error

  windows-build:
    name: Windows JDK 21 Build and Test
    runs-on: windows-latest

    steps:
      - name: Check out DRAT
        uses: actions/checkout@v4
        with:
          path: drat

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Node 22, not 18. jsdom reaches whatwg-url, which now depends on
      # @exodus/bytes, and that package is ESM only: requiring it from
      # CommonJS is ERR_REQUIRE_ESM on Node 18, which cannot require an ES
      # module at all. Node 22.12 can, so the frontend suite runs there.
      # Node 18 also went end of life in April 2025.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: drat/webapps/proteus/src/main/webapp/resources/package-lock.json

      - name: Cache the Solr distribution
        uses: actions/cache@v4
        with:
          path: ~/.cache/drat-solr
          key: windows-solr-${{ hashFiles('drat/distribution/pom.xml') }}
          restore-keys: windows-solr-

      - name: Build and test DRAT
        working-directory: drat
        run: mvn -B clean install

      - name: Test Proteus frontend
        working-directory: drat/webapps/proteus/src/main/webapp/resources
        run: npm test -- --run

      - name: Check Windows launcher and distribution
        shell: pwsh
        working-directory: drat
        run: |
          & ./distribution/src/main/resources/bin/drat.ps1 help

          $archive = Get-ChildItem -LiteralPath distribution/target `
            -Filter 'dms-distribution-*-bin.tar.gz' | Select-Object -First 1
          if (-not $archive) {
            throw 'The packaged DRAT distribution was not produced.'
          }

          $entries = tar -tzf $archive.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect $($archive.FullName)"
          }
          if (-not ($entries -match '(^|/)bin/drat\.ps1$')) {
            throw 'The packaged distribution does not contain bin/drat.ps1.'
          }
          Write-Host 'Windows launcher and distribution contents OK'

      - name: Upload Windows-tested DRAT distribution
        uses: actions/upload-artifact@v4
        with:
          name: drat-distribution-windows-tested
          path: drat/distribution/target/dms-distribution-*-bin.tar.gz
          if-no-files-found: error
