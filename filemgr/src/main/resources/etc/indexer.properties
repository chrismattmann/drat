# Configures the Solr Indexer tool

# basic config properties

# a set of product types to ignore dumping
config.ignore.types=SomeProductType

# any met values to ignore indexing
config.ignore.values=TBD

# the URL path to Solr
config.solr.url=http://localhost:8983/solr/drat

# the URL path to the File Manager
#
# 9001 is the workflow manager. This is only a fallback -- both the drat
# script and Proteus pass the file manager's url explicitly -- but a fallback
# that names the wrong service is worse than none. Left as a literal because
# the indexer reads this one straight out of the properties and does no token
# replacement on it, unlike access.url below.
config.filemgr.url=http://localhost:9000

# Data access for the products
config.access.key=ProductURL
# Served by this deployment's own Tomcat, so it follows the port that
# deployment declares. Written as 8080, which is DRAT's only where DRAT owns
# it: on a host running a second OODT installation that port belongs to
# something else, and this would point every indexed product at another
# deployment's product service. These tokens are resolved downstream, which
# is where the complaint about the unresolved one below was coming from.
#
# It ends at the equals sign because the indexer appends the product id to
# whatever this says:
#
#     metadata.addMetadata(config.getProperty(ACCESS_KEY),
#         config.getProperty(ACCESS_URL) + metadata.getMetadata("CAS.ProductId"))
#
# so [ProductId] here was never substituted and never could be. It sat in the
# middle of the finished URL, ahead of the id the code had already added.
config.access.url=http://[OODT_HOST]:[TOMCAT_PORT]/cas-product/data?productID=

# Add a comma seperated list of values for keys 
# that will go through metadata replacement. 
# For example the ProductURL above will fill in
# the actual value for the [ProductId]
config.replacement.keys=ProductURL

# Must have map for unique id in Solr
map.CAS.ProductId=id

# Must map this field to enable deletion of Solr records by name
map.CAS.ProductName=ProductName

# Map from File Manager terminology into Solr 
# index doc field terminology. Only mapped fields 
# will be added to the Solr index.
map.MimeType=mimetype
map.CAS.ProductReceivedTime=receivedtime
map.FileSize=filesize
map.FileName=filename
map.FileLocation=filelocation
map.ProductType=producttype
map.ProductStructure=productstructure
map.CAS.ProductName=filename

# map.ProductURL=producturl

# Formatting of date fields can be specified for a
# field coming from Solr. Solr requires a specific 
# format when you want to map to a date so one must
# specify the source format in the filemanager.  
format.CAS.ProductReceivedTime=yyyy-MM-dd'T'HH:mm:ss.SSS
